<script>
  (function () {
    "use strict";

    let currentConfig = null;

    function setStatus(elId, message, isError) {
      const el = document.getElementById(elId);
      el.textContent = message;
      el.className = "status " + (isError ? "error" : "ok");
      if (!isError) {
        setTimeout(() => {
          if (el.textContent === message) el.textContent = "";
        }, 4000);
      }
    }

    function renderQuestions(questions) {
      const list = document.getElementById("questions-list");
      list.innerHTML = "";
      questions.forEach((q, i) => {
        const row = document.createElement("div");
        row.className = "question-row";
        row.innerHTML =
          '<input type="text" placeholder="Nhãn hiển thị" value="' +
          escapeAttr(q.label) +
          '" data-field="label" />' +
          '<input type="text" placeholder="Câu hỏi gửi khi bấm" value="' +
          escapeAttr(q.prompt) +
          '" data-field="prompt" />' +
          '<button type="button" class="btn btn-danger" data-remove="' +
          i +
          '">Xóa</button>';
        list.appendChild(row);
      });
      list.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-remove"), 10);
          currentConfig.suggestedQuestions.splice(idx, 1);
          renderQuestions(currentConfig.suggestedQuestions);
        });
      });
    }

    function escapeAttr(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML.replace(/"/g, "&quot;");
    }

    function collectQuestionsFromForm() {
      const rows = document.querySelectorAll("#questions-list .question-row");
      const result = [];
      rows.forEach((row) => {
        const label = row.querySelector('[data-field="label"]').value.trim();
        const prompt = row.querySelector('[data-field="prompt"]').value.trim();
        if (label || prompt) result.push({ label: label, prompt: prompt });
      });
      return result;
    }

    function fillForm(data) {
      currentConfig = data.botConfig;

      document.getElementById("system-prompt").value = data.systemPrompt;
      document.getElementById("knowledge-base").value = data.knowledgeBase;
      document.getElementById("knowledge-length").textContent =
        data.knowledgeBase.length.toLocaleString("vi-VN") + " ký tự";

      document.getElementById("cfg-botName").value = currentConfig.botName || "";
      document.getElementById("cfg-botSubtitle").value = currentConfig.botSubtitle || "";
      document.getElementById("cfg-greeting").value = currentConfig.greeting || "";
      document.getElementById("cfg-logoUrl").value = currentConfig.logoUrl || "";
      const color = currentConfig.primaryColor || "#4f7a6b";
      document.getElementById("cfg-primaryColor").value = color;
      document.getElementById("cfg-primaryColorPicker").value = color;

      const contact = currentConfig.contactInfo || {};
      document.getElementById("cfg-hotline").value = contact.hotline || "";
      document.getElementById("cfg-zalo").value = contact.zalo || "";
      document.getElementById("cfg-email").value = contact.email || "";
      document.getElementById("cfg-hours").value = contact.hours || "";

      document.getElementById("cfg-marqueeEnabled").checked = !!currentConfig.marqueeEnabled;
      document.getElementById("cfg-marqueeText").value = currentConfig.marqueeText || "";

      renderQuestions(currentConfig.suggestedQuestions || []);
    }

    function loadData() {
      google.script.run
        .withSuccessHandler(fillForm)
        .withFailureHandler((err) => {
          document.getElementById("global-status").innerHTML =
            '<p class="status error">Lỗi tải dữ liệu: ' + err.message + "</p>";
        })
        .adminGetData();
      loadAccessCodes();
    }

    // ---- Kiểm soát người dùng (mã truy cập) ----

    function fmtDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return d.toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" });
    }

    function renderAccessTable(list) {
      const body = document.getElementById("access-table-body");
      const emptyHint = document.getElementById("access-empty-hint");
      body.innerHTML = "";
      emptyHint.style.display = list.length ? "none" : "block";
      list.forEach((item) => {
        const row = document.createElement("tr");
        row.innerHTML =
          "<td>" + escapeAttr(item.label) + "</td>" +
          "<td><code>" + escapeAttr(item.code) + "</code></td>" +
          "<td>" + item.deviceCount + "/" + item.maxDevices + "</td>" +
          "<td>" + fmtDate(item.createdAt) + "</td>" +
          "<td>" + fmtDate(item.lastUsedAt) + "</td>" +
          '<td class="access-actions">' +
          '<button type="button" class="btn" data-reset="' + escapeAttr(item.code) + '">Reset thiết bị</button>' +
          '<button type="button" class="btn btn-danger" data-delete="' + escapeAttr(item.code) + '">Xóa</button>' +
          "</td>";
        body.appendChild(row);
      });

      body.querySelectorAll("[data-reset]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const code = btn.getAttribute("data-reset");
          btn.disabled = true;
          google.script.run
            .withSuccessHandler(() => loadAccessCodes())
            .withFailureHandler((err) => {
              btn.disabled = false;
              alert("Lỗi: " + err.message);
            })
            .adminResetAccessCodeDevices(code);
        });
      });

      body.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const code = btn.getAttribute("data-delete");
          if (!confirm("Xóa mã này? Người đang dùng mã sẽ không chat được nữa.")) return;
          btn.disabled = true;
          google.script.run
            .withSuccessHandler(() => loadAccessCodes())
            .withFailureHandler((err) => {
              btn.disabled = false;
              alert("Lỗi: " + err.message);
            })
            .adminDeleteAccessCode(code);
        });
      });
    }

    function loadAccessCodes() {
      google.script.run
        .withSuccessHandler(renderAccessTable)
        .withFailureHandler((err) => {
          setStatus("status-access-create", "Lỗi tải danh sách: " + err.message, true);
        })
        .adminListAccessCodes();
    }

    document.getElementById("btn-create-access").addEventListener("click", (e) => {
      const btn = e.target;
      const input = document.getElementById("access-new-label");
      const label = input.value.trim();
      if (!label) {
        setStatus("status-access-create", "Vui lòng nhập tên người được cấp mã.", true);
        return;
      }
      btn.disabled = true;
      google.script.run
        .withSuccessHandler((result) => {
          btn.disabled = false;
          input.value = "";
          document.getElementById("status-access-create").innerHTML =
            '<div class="access-new-code-banner">Đã tạo mã cho <strong>' +
            escapeAttr(result.label) +
            '</strong>: <code>' +
            escapeAttr(result.code) +
            "</code> — gửi mã này cho họ để dùng chat.</div>";
          loadAccessCodes();
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          setStatus("status-access-create", "Lỗi: " + err.message, true);
        })
        .adminCreateAccessCode(label);
    });

    // ---- Sự kiện ----

    document.getElementById("cfg-primaryColorPicker").addEventListener("input", (e) => {
      document.getElementById("cfg-primaryColor").value = e.target.value;
    });

    document.getElementById("btn-add-question").addEventListener("click", () => {
      currentConfig.suggestedQuestions.push({ label: "", prompt: "" });
      renderQuestions(currentConfig.suggestedQuestions);
    });

    document.getElementById("btn-save-config").addEventListener("click", (e) => {
      const btn = e.target;
      const hex = document.getElementById("cfg-primaryColor").value.trim();
      if (!/^#[0-9a-fA-F]{6}$/.test(hex)) {
        setStatus("status-config", 'Màu không hợp lệ — cần đúng định dạng hex, ví dụ "#4f7a6b".', true);
        return;
      }
      const config = {
        botName: document.getElementById("cfg-botName").value.trim(),
        botSubtitle: document.getElementById("cfg-botSubtitle").value.trim(),
        greeting: document.getElementById("cfg-greeting").value,
        logoUrl: document.getElementById("cfg-logoUrl").value.trim(),
        primaryColor: hex,
        suggestedQuestions: collectQuestionsFromForm(),
        contactInfo: {
          hotline: document.getElementById("cfg-hotline").value.trim(),
          zalo: document.getElementById("cfg-zalo").value.trim(),
          email: document.getElementById("cfg-email").value.trim(),
          hours: document.getElementById("cfg-hours").value.trim(),
        },
        marqueeEnabled: document.getElementById("cfg-marqueeEnabled").checked,
        marqueeText: document.getElementById("cfg-marqueeText").value.trim(),
      };
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(() => {
          btn.disabled = false;
          currentConfig = config;
          setStatus("status-config", "Đã lưu.", false);
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          setStatus("status-config", "Lỗi: " + err.message, true);
        })
        .adminSaveBotConfig(config);
    });

    document.getElementById("btn-save-prompt").addEventListener("click", (e) => {
      const btn = e.target;
      const text = document.getElementById("system-prompt").value;
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(() => {
          btn.disabled = false;
          setStatus("status-prompt", "Đã lưu.", false);
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          setStatus("status-prompt", "Lỗi: " + err.message, true);
        })
        .adminSaveSystemPrompt(text);
    });

    document.getElementById("btn-reset-prompt").addEventListener("click", (e) => {
      if (!confirm("Xóa bản ghi đè System Prompt và quay lại dùng đúng nội dung mới nhất trong code? Hành động này không hoàn tác được.")) return;
      const btn = e.target;
      btn.disabled = true;
      google.script.run
        .withSuccessHandler((result) => {
          btn.disabled = false;
          document.getElementById("system-prompt").value = result.systemPrompt;
          setStatus("status-prompt", "Đã khôi phục về nội dung mặc định trong code.", false);
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          setStatus("status-prompt", "Lỗi: " + err.message, true);
        })
        .adminResetSystemPrompt();
    });

    document.getElementById("btn-save-knowledge").addEventListener("click", (e) => {
      const btn = e.target;
      const text = document.getElementById("knowledge-base").value;
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(() => {
          btn.disabled = false;
          document.getElementById("knowledge-length").textContent = text.length.toLocaleString("vi-VN") + " ký tự";
          setStatus("status-knowledge", "Đã lưu.", false);
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          setStatus("status-knowledge", "Lỗi: " + err.message, true);
        })
        .adminSaveKnowledgeBase(text);
    });

    loadData();
  })();
</script>
