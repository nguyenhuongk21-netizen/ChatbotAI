<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Prana Guide AI — Chat</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Trang này chỉ để nhúng qua <iframe> vào website khác — nền PHẢI trong suốt
         để chỉ thấy bong bóng/khung chat, không thấy khung nền trắng của iframe. */
      html,
      body,
      #chat-widget-root {
        background: transparent !important;
        margin: 0;
        padding: 0;
        height: 100%;
      }
      /* Phần trong suốt (ngoài bong bóng/khung chat) phải "xuyên thấu" chuột để
         không che mất nội dung trên website nhúng — chỉ khung chat mới nhận click. */
      html,
      body,
      #chat-widget-root {
        pointer-events: none;
      }
      .chat-fab,
      .chat-widget,
      .modal-overlay {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="chat-widget-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
